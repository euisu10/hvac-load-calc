<!DOCTYPE html>
<html lang="ko" data-skin="black">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>클린룸 HVAC 부하계산서</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout idea: engineering worksheet — inputs (yellow cells, as in the company Excel) on the left, live results pinned on the right; report view = A4 calc-sheet pages */
:root{
  /* WHITE skin */
  --ink:#16202b; --paper:#eef1f4; --sheet:#ffffff; --rule:#cfd6de; --muted:#5b6876;
  --accent:#e2601c;            /* SHINSUNG E&G orange */
  --blue:#1f86c4; --green:#6fae2b;
  --input:#fff8d6; --inputBd:#e6d9a3; --autobg:#eef3f8; --soft:#f6f8fa; --th:#e8edf2; --tint:#fdeee5;
  --pillbg:#e3f0f9; --pilltx:#1f6fa3; --warnbg:#fbeadb; --warnsoft:#fdf5ee; --oksoft:#eef7f1; --reqbg:#fff3e6;
  --ok:#3d8a1f; --warn:#c2581b; --bad:#b3261e; --bar:#ffffff; --barTx:#16202b;
  --f-body:"IBM Plex Sans KR","Malgun Gothic","Apple SD Gothic Neo",sans-serif;
  --f-num:"IBM Plex Mono",Consolas,monospace;
  color-scheme:light;
}
html[data-skin="black"]{
  --ink:#e6eaee; --paper:#121519; --sheet:#1b1f25; --rule:#323943; --muted:#98a4b0;
  --accent:#f2661e; --blue:#2e9bd6; --green:#8dc63f;
  --input:#2a2821; --inputBd:#4d4630; --autobg:#232930; --soft:#20252c; --th:#262c34; --tint:rgba(242,102,30,.14);
  --pillbg:rgba(46,155,214,.16); --pilltx:#66bdea; --warnbg:rgba(242,102,30,.2); --warnsoft:rgba(242,102,30,.10); --oksoft:rgba(141,198,63,.12); --reqbg:rgba(242,102,30,.12);
  --ok:#8dc63f; --warn:#f2894a; --bad:#ff6b5e; --bar:#1b1f25; --barTx:#e6eaee;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:13.5px;line-height:1.45}
.num,td.n,input[type=number]{font-family:var(--f-num);font-variant-numeric:tabular-nums}
h1,h2,h3{text-wrap:balance;margin:0}
button{font:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* top bar */
.bar{position:sticky;top:0;z-index:20;background:var(--paper);padding:10px 16px 0}
.bar .in{background:var(--bar);color:var(--barTx);border:1px solid var(--rule);border-radius:10px;display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;padding:10px 14px}
.bar .stripe{height:3px;margin:6px 2px 0;border-radius:2px;background:linear-gradient(90deg,var(--blue),var(--green) 50%,var(--accent))}
.brand{display:flex;align-items:center;gap:10px}
.brand .ico{width:34px;height:34px;border-radius:8px;background:var(--tint);display:grid;place-items:center;color:var(--accent)}
.bar h1{font-size:16px;font-weight:700;letter-spacing:.01em}
.bar h1 em{font-style:normal;color:var(--accent)}
.bar .sub{font-size:11px;color:var(--muted);font-family:var(--f-num);letter-spacing:.04em}
.bar .sp{flex:1}
.seg2{display:flex;gap:4px}
.seg2 button{border:1px solid var(--rule);background:transparent;color:var(--muted);padding:4px 9px;border-radius:5px;font-family:var(--f-num);font-size:11.5px;font-weight:600}
.seg2 button[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);background:var(--tint)}
.logo{display:flex;align-items:center;gap:7px;padding-left:6px}
.logo img{height:22px;width:auto}
.logo span{font-weight:800;font-size:11px;line-height:1.05;letter-spacing:.02em;color:var(--barTx)}
.bar .row2{border-top:1px dashed var(--rule);padding-top:8px;margin-top:2px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;width:100%}
.bar .tabs{display:flex;gap:4px;background:var(--soft);border:1px solid var(--rule);padding:3px;border-radius:7px}
.bar .tabs button{border:0;background:transparent;color:var(--muted);padding:5px 12px;border-radius:5px;font-weight:600}
.bar .tabs button[aria-pressed="true"]{background:var(--accent);color:#fff}
.btn{border:1px solid var(--rule);background:var(--sheet);color:var(--ink);padding:6px 12px;border-radius:6px;font-weight:500}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.pri{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn.pri:hover{color:#fff;filter:brightness(1.08)}
.psy{background:#fff;border-radius:6px}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:9px 16px;border-radius:6px;font-size:13px;z-index:50;display:none;max-width:90vw}

/* calc view */
.wrap{display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:16px;padding:16px 20px;max-width:1500px;margin:0 auto}
@media (max-width:1050px){.wrap{grid-template-columns:minmax(0,1fr)}.side{position:static!important;max-height:none!important;overflow:visible!important}}
.wrap>*{min-width:0}details.card{min-width:0;overflow:hidden}.scroll{max-width:100%;-webkit-overflow-scrolling:touch}
#report{overflow-x:auto;-webkit-overflow-scrolling:touch}
@media (max-width:700px){.wrap{padding:10px 8px;gap:10px}.bar{padding:6px 6px 0;position:static}.bar .in{padding:8px 10px}.grid{grid-template-columns:minmax(0,1fr)}.f.wide{grid-template-columns:110px minmax(0,1fr)}summary .hint{display:none}.rpt-tools{padding:0 8px}}
.card{background:var(--sheet);border:1px solid var(--rule);border-radius:6px}
details.card{margin-bottom:12px}
details.card>summary{list-style:none;padding:10px 14px;font-weight:600;display:flex;gap:10px;align-items:center;cursor:pointer;border-bottom:1px solid transparent}
details.card[open]>summary{border-bottom-color:var(--rule)}
details.card>summary::-webkit-details-marker{display:none}
summary .no{font-family:var(--f-num);color:var(--accent);font-size:12px;min-width:26px}
summary .hint{font-weight:400;color:var(--muted);font-size:12px;margin-left:auto}
summary::after{content:"▾";color:var(--muted);font-size:11px}
details:not([open])>summary::after{content:"▸"}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px 14px;padding:12px 14px}
.f{display:grid;grid-template-columns:1fr 118px 52px;align-items:center;gap:6px}
.f.af{grid-template-columns:1fr 92px 52px 44px}
.f.af .btn.mini{padding:3px 0;font-size:11.5px}
.f.af small.man{color:var(--warn)}
.f.wide{grid-column:1/-1;grid-template-columns:160px 1fr}
.f label{font-size:12.5px;color:var(--ink)}
.f .u{font-size:11px;color:var(--muted)}
.f small{grid-column:1/-1;color:var(--muted);font-size:11px;margin-top:-3px}
input,select{font:inherit;width:100%;border:1px solid var(--inputBd);background:var(--input);padding:4px 6px;border-radius:3px;color:var(--ink);min-width:0}
input[type=number]{text-align:right}
input.auto{background:var(--autobg);color:var(--muted)}
.subhdr{grid-column:1/-1;display:flex;align-items:baseline;gap:10px;margin-top:8px;padding:8px 0 2px;border-top:1px dashed var(--rule)}.subhdr b{font-size:12.5px;color:var(--accent)}.subhdr span{font-size:11.5px;color:var(--muted)}
input.outv{background:var(--autobg);border-color:var(--rule);text-align:right;font-family:var(--f-num);font-weight:700;font-size:15px;color:var(--blue)}
input.outv.tot{background:var(--tint);border-color:var(--accent);color:var(--accent);font-size:16px}
.tbl-in{width:100%;border-collapse:collapse;font-size:12.5px}
.tbl-in th{background:var(--th);font-weight:600;font-size:11.5px;padding:5px 4px;border:1px solid var(--rule);text-align:center}
.tbl-in td{border:1px solid var(--rule);padding:2px}
.tbl-in td input{border:0;border-radius:0}
.tbl-in td.n{text-align:right;padding:2px 6px;background:var(--soft)}
.scroll{overflow-x:auto;padding:12px 14px}
.tbl-in.cond td{padding:4px 8px}.tbl-in.cond td:first-child{text-align:left}.tbl-in.cond tr.fx td{background:var(--soft)}.tbl-in.cond tr.dew td:first-child{padding-left:20px;color:var(--muted)}.tbl-in.cond td input{padding:3px 6px}.tbl-in td.c{text-align:center}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.seg button{border:1px solid var(--rule);background:var(--sheet);border-radius:6px;padding:8px 12px;text-align:left;display:flex;flex-direction:column;gap:2px;color:var(--ink)}
.seg button small{color:var(--muted);font-size:11.5px}
.seg button[aria-pressed="true"]{border-color:var(--accent);background:var(--tint);box-shadow:inset 0 0 0 1px var(--accent)}
.seg button[aria-pressed="true"] b{color:var(--accent)}
.chk{display:flex;gap:18px;margin-top:10px;font-size:12.5px}.chk input{width:auto;margin-right:5px;vertical-align:-2px}
.pinfo{font-size:12px;color:var(--muted);flex:1;min-width:260px}.pinfo b{color:var(--ink);font-family:var(--f-num);font-weight:600}
details.sub{margin:0 14px 12px;border:1px dashed var(--rule);border-radius:5px}
details.sub>summary{list-style:none;padding:8px 12px;cursor:pointer;font-weight:600;font-size:12.5px;color:var(--muted)}
details.sub>summary::-webkit-details-marker{display:none}
details.sub>summary span{font-weight:400;font-size:11.5px;margin-left:6px}
details.sub[open]>summary{border-bottom:1px dashed var(--rule)}
.ahuin{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:10px 14px;border-bottom:1px solid var(--rule);background:var(--soft)}
.ahuin label{font-size:11.5px;color:var(--muted);display:block;margin-bottom:2px}
.list .sec{border-bottom:0;padding-top:8px;font-weight:600;font-size:11.5px;color:var(--accent)}
.list b small{color:var(--muted);font-weight:400;margin-left:4px}
.chips{grid-column:2/-1;display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.chips span{font-size:11px;color:var(--muted);margin-right:4px}
.chip{border:1px solid var(--rule);background:var(--sheet);border-radius:12px;padding:1px 9px;font-family:var(--f-num);font-size:11.5px;color:var(--ink)}
.chip:hover,.chip.on{border-color:var(--accent);color:var(--accent);background:var(--tint)}
input.req:placeholder-shown{border-color:var(--warn);background:var(--reqbg)}
.empty{padding:18px 14px;font-size:12.5px;color:var(--muted)}
.empty b{color:var(--warn)}
.chtabs{display:flex;gap:0;border-bottom:1px solid var(--rule);padding:0 14px;background:var(--soft)}
.chtabs button{border:0;background:none;padding:9px 12px;font-weight:600;font-size:12.5px;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
.chtabs button[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}
.psy{width:100%;height:auto;display:block}
.psy2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(460px,100%),1fr));gap:12px}.psy2 figure{margin:0}
.psycap{font-size:11.5px;line-height:1.6;margin-top:4px;color:var(--ink)}.psycap span{white-space:nowrap}
.page .psy2{grid-template-columns:1fr;gap:4px}.page .psycap{font-size:9px;line-height:1.35;margin:1px 0 2px}.page .psycap span{white-space:normal}
.psyt td{padding:3px 8px}
.row-x{border:0;background:none;color:var(--bad);font-size:15px;padding:0 6px}
.addrow{margin:0 14px 12px}

/* OAC */
.procseg{display:flex;align-items:center;gap:10px 12px;flex-wrap:wrap;padding:12px 14px 0}.procseg .seg{flex:1;min-width:300px;max-width:820px}.procseg .sb-l{font-weight:700;font-size:12.5px;color:var(--accent)}
.rtab td input.kwreq{border:1px solid var(--warn)!important;background:var(--reqbg)!important}
.sysbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 14px;margin-bottom:12px}.sysbar .sb-l{font-weight:700;font-size:12.5px;color:var(--accent)}.sb-seg{flex:1;min-width:260px;max-width:620px}
.oacwrap{grid-template-columns:minmax(0,1fr) 380px}
@media (max-width:1050px){.oacwrap{grid-template-columns:minmax(0,1fr)}}
/* rooms table */
.rwrap{padding-bottom:6px}
.rtab{width:auto;font-size:12px}.rtab th{white-space:nowrap;font-size:11px;line-height:1.2}.rtab th small{display:block;font-weight:400;color:var(--muted);font-size:10px}
.rtab th.grp{background:var(--soft);color:var(--accent);font-weight:700;letter-spacing:.02em}.rtab th.au{color:var(--muted)}
.rtab td input,.rtab td select{padding:3px 5px;font-size:12px;height:26px}.rtab td select{border:0;border-radius:0;background:var(--input)}
.rtab td input.ra:placeholder-shown{background:var(--autobg)}.rtab td input.ra::placeholder{color:var(--muted);opacity:1}.rtab td input.ra:not(:placeholder-shown){color:var(--warn);font-weight:600}
.rtab td input.dis{opacity:.35}.rtab td.ro{background:var(--autobg);font-weight:700;color:var(--blue);padding:2px 6px}
.rtab .stk{position:sticky;left:0;z-index:2;background:var(--sheet)}.rtab .stk2 input{font-weight:600}.rtab .stk2{left:62px;box-shadow:2px 0 0 var(--rule)}.rtab td.act{min-width:62px;max-width:62px}.rtab td.act{white-space:nowrap;padding:0 4px;text-align:center}.rtab td.act b{font-family:var(--f-num);margin-right:2px}
/* rooms as wrapping cards (no horizontal scroll) */
.rcards{display:flex;flex-direction:column;gap:8px;padding:10px 12px 6px}
.rstrip{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 14px;padding:4px 10px;background:var(--soft);border-bottom:1px solid var(--rule);font-size:11px}
.rstrip .rsl{font-weight:700;color:var(--accent);margin-right:2px}
.rstrip .rsi{white-space:nowrap}.rstrip .rsi i{font-style:normal;color:var(--muted);margin-right:4px}
.rstrip .rsi b{font-family:var(--f-num);font-weight:700;color:var(--blue)}.rstrip .rsi small{color:var(--muted);margin-left:2px;font-size:10px}
details.rstd{border-top:1px dashed var(--rule)}
details.rstd>summary{list-style:none;display:grid;grid-template-columns:76px minmax(0,1fr) auto;align-items:center;gap:8px;cursor:pointer;font-size:11px;padding-right:10px}
details.rstd>summary::-webkit-details-marker{display:none}details.rstd>summary::after{display:none}
details.rstd>summary>b{font-size:11px;color:var(--muted);padding:6px 8px;background:var(--soft);border-right:1px solid var(--rule);align-self:stretch;display:flex;align-items:center;gap:4px}
details.rstd>summary>b::before{content:"▸";color:var(--muted)}details.rstd[open]>summary>b::before{content:"▾"}
details.rstd>summary .rsumt{font-family:var(--f-num);color:var(--muted);line-height:1.5;padding:4px 0}details.rstd>summary .sep{color:var(--rule);margin:0 4px}
details.rstd>summary .rhint{color:var(--muted);font-size:10.5px;opacity:.8;white-space:nowrap}
details.rstd[open]>summary{border-bottom:1px dashed var(--rule)}details.rstd[open]>summary .rsumt{display:none}
details.rstd .rgrp:last-child{border-bottom:0}
.rcard{border:1px solid var(--rule);border-radius:6px;background:var(--sheet);overflow:hidden}
.rcard-h{display:flex;align-items:center;gap:8px;padding:4px 8px;background:var(--th);border-bottom:1px solid var(--rule)}
.rcard-h .rno{font-family:var(--f-num);font-weight:700;color:var(--accent);min-width:20px}
.rcard-h input{max-width:300px;font-weight:600;height:26px}
.rcard-h .sp{flex:1}
.rgrp{display:grid;grid-template-columns:76px minmax(0,1fr);border-bottom:1px dashed var(--rule)}
.rgrp:last-child{border-bottom:0}
.rgrp>b{font-size:11px;color:var(--accent);padding:6px 8px;background:var(--soft);border-right:1px solid var(--rule)}
.rflds{display:grid;grid-template-columns:repeat(auto-fill,minmax(80px,1fr));gap:2px 6px;padding:4px 8px 5px}
.rf{display:flex;flex-direction:column;gap:1px;min-width:0}
.rf.w2{grid-column:span 2}
.rf label{font-size:10.5px;font-weight:600;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rf label small{font-weight:400;color:var(--muted);margin-left:3px;font-size:10px}
.rf.au label{color:var(--muted)}
.rf input,.rf select{height:24px;padding:2px 5px;font-size:11.5px}
.rf .ro{height:27px;display:flex;align-items:center;justify-content:flex-end;gap:4px;padding:0 6px;border-radius:3px;background:var(--autobg);border:1px solid var(--rule);font-family:var(--f-num);font-weight:700;color:var(--blue);font-size:12px;white-space:nowrap;overflow:hidden}
.rcard input.ra:placeholder-shown{background:var(--autobg)}.rcard input.ra::placeholder{color:var(--muted);opacity:1}.rcard input.ra:not(:placeholder-shown){color:var(--warn);font-weight:600}
.rcard input.dis{opacity:.35}
.eacalc{grid-column:1/-1;margin-top:3px;padding:4px 8px;border:1px dashed var(--rule);border-radius:3px;background:var(--soft);font-family:var(--f-num);font-size:11px;line-height:1.65;color:var(--muted)}
.eacalc b{color:var(--blue);font-weight:700}.eacalc .tt{color:var(--accent);font-family:var(--f-body);font-weight:700;margin-right:4px}.eacalc .hint{color:var(--warn);font-family:var(--f-body)}
.rcard input.kwreq{border:1px solid var(--warn)!important;background:var(--reqbg)!important}
@media (max-width:700px){details.rstd>summary{grid-template-columns:minmax(0,1fr)}details.rstd>summary .rhint{display:none}.rgrp{grid-template-columns:minmax(0,1fr)}.rgrp>b{border-right:0;border-bottom:1px solid var(--rule);padding:5px 10px}.rflds{grid-template-columns:repeat(auto-fill,minmax(92px,1fr))}.rf.w2{grid-column:auto}}
.row-b{border:0;background:none;color:var(--muted);font-size:13px;padding:0 3px}.row-b:hover{color:var(--accent)}
.rbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:0 14px 8px}
.rres{font-size:11.5px}.rres th{font-size:10.5px;line-height:1.2;white-space:nowrap}.rres th small{display:block;font-weight:400;color:var(--muted)}.rres td{padding:3px 6px!important;white-space:nowrap}
.rres td.sel{background:var(--pillbg)!important;color:var(--pilltx);font-weight:700}.rres td.fin{font-weight:700;color:var(--blue)}.rres tfoot td{font-weight:700;background:var(--th)!important}
/* side results */
.sabox{margin:4px 14px 10px;border:2px solid var(--blue);border-radius:8px;overflow:hidden}
.sabox .sah{background:var(--blue);color:#fff;padding:6px 10px;font-weight:700;font-size:12.5px;display:flex;justify-content:space-between;align-items:center}
.sabox .sah small{font-weight:400;opacity:.9;font-family:var(--f-num);font-size:11px}
.sabox .cand{display:grid;grid-template-columns:22px 1fr auto auto;gap:4px 8px;align-items:center;padding:6px 10px;border-bottom:1px dashed var(--rule);font-size:12px;color:var(--muted)}
.sabox .cand .no{font-family:var(--f-num);font-weight:700;text-align:center;border:1px solid var(--rule);border-radius:50%;width:20px;height:20px;line-height:18px;font-size:11px}
.sabox .cand .fm{grid-column:2/4;font-family:var(--f-num);font-size:10.5px;opacity:.85}
.sabox .cand .val{font-family:var(--f-num);font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.sabox .cand .tag{font-size:10.5px;font-weight:700;white-space:nowrap}
.sabox .cand.on{background:var(--pillbg);color:var(--ink);box-shadow:inset 4px 0 0 var(--blue)}
.sabox .cand.on .no{background:var(--blue);border-color:var(--blue);color:#fff}
.sabox .cand.on .val{font-weight:700;color:var(--pilltx)}
.sabox .cand.on .tag{color:var(--pilltx)}
.sabox .res{padding:9px 12px;display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;background:var(--soft)}
.sabox .res .l{font-size:12px;font-weight:700}
.sabox .res .l small{display:block;font-weight:400;color:var(--muted);font-size:11px;font-family:var(--f-num)}
.sabox .res .v{font-family:var(--f-num);font-size:22px;font-weight:700;color:var(--blue)}
.sabox .res .v small{font-size:11px;color:var(--muted);font-weight:400;margin-left:3px}
.kpi.sa{box-shadow:inset 0 -3px 0 var(--blue)}.kpi.sa .v{color:var(--blue)}

.side{position:sticky;top:124px;align-self:start;display:flex;flex-direction:column;gap:12px;max-height:calc(100vh - 140px);overflow:auto}
.side h2{font-size:13px;padding:10px 14px;border-bottom:1px solid var(--rule);display:flex;justify-content:space-between}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--rule)}
.kpi{background:var(--sheet);padding:9px 12px}
.kpi .k{font-size:11.5px;color:var(--muted)}

<script>
// ===== HVAC / CLEAN ROOM HEAT LOAD ENGINE (mirrors company Excel rev4) =====
const XL = {

// saturation pressure kPa (Hyland-Wexler over water, t in °C)
function pws(t) {

}
function absHum(t, rh, P) { const pw = pws(t) * rh / 100; return 0.622 * pw / (P - pw); }
function rhFrom(t, w, P) { const pw = w * P / (0.622 + w); return pw / pws(t) * 100; }
function dewPoint(w, P) { // invert

}

// ===== 2-1. GIVEN DATA — fixed design conditions (company standard) =====

// 냉방 방식 일러스트 (일반 형태 · 자체 제작 SVG)
const EQ_SVG = {"dx": "<rect x=\"40\" y=\"12\" width=\"120\" height=\"118\" rx=\"4\" fill=\"#e9eef3\" stroke=\"#475569\" stroke-width=\"2\"/> <rect x=\"40\" y=\"12\" width=\"120\" height=\"10\" fill=\"#cbd5e1\" stroke=\"#475569\" stroke-width=\"2\"/> <g stroke=\"#64748b\" stroke-width=\"1.2\" fill=\"none\"> <circle cx=\"100\" cy=\"56\" r=\"28\"/><circle cx=\"100\" cy=\"56\" r=\"20\"/><circle cx=\"100\" cy=\"56\" r=\"12\"/> <circle cx=\"100\" cy=\"104\" r=\"20\" /><circle cx=\"100\" cy=\"104\" r=\"12\"/> <line x1=\"72\" y1=\"56\" x2=\"128\" y2=\"56\"/><line x1=\"100\" y1=\"28\" x2=\"100\" y2=\"84\"/> <line x1=\"80\" y1=\"104\" x2=\"120\" y2=\"104\"/><line x1=\"100\" y1=\"84\" x2=\"100\" y2=\"124\"/></g> <circle cx=\"100\" cy=\"56\" r=\"4\" fill=\"#475569\"/><circle cx=\"100\" cy=\"104\" r=\"3\" fill=\"#475569\"/> <rect x=\"44\" y=\"128\" width=\"12\" height=\"6\" fill=\"#475569\"/><rect x=\"144\" y=\"128\" width=\"12\" height=\"6\" fill=\"#475569\"/> <path d=\"M164 40 q14 0 14 14\" stroke=\"#e0602a\" stroke-width=\"2\" fill=\"none\"/><path d=\"M164 70 q14 0 14 -14\" stroke=\"#1d6fb8\" stroke-width=\"2\" fill=\"none\"/> <text x=\"181\" y=\"46\" font-size=\"9\" fill=\"#e0602a\">H</text><text x=\"181\" y=\"70\" font-size=\"9\" fill=\"#1d6fb8\">C</text>", "ac": "<path d=\"M14 50 L186 50 L176 118 L24 118 Z\" fill=\"#e9eef3\" stroke=\"#475569\" stroke-width=\"2\"/> <g stroke=\"#94a3b8\" stroke-width=\"1\"> <line x1=\"30\" y1=\"56\" x2=\"38\" y2=\"112\"/><line x1=\"44\" y1=\"56\" x2=\"50\" y2=\"112\"/><line x1=\"58\" y1=\"56\" x2=\"62\" y2=\"112\"/><line x1=\"72\" y1=\"56\" x2=\"74\" y2=\"112\"/> <line x1=\"170\" y1=\"56\" x2=\"162\" y2=\"112\"/><line x1=\"156\" y1=\"56\" x2=\"150\" y2=\"112\"/><line x1=\"142\" y1=\"56\" x2=\"138\" y2=\"112\"/><line x1=\"128\" y1=\"56\" x2=\"126\" y2=\"112\"/></g> <rect x=\"84\" y=\"62\" width=\"32\" height=\"40\" rx=\"3\" fill=\"#cbd5e1\" stroke=\"#475569\" stroke-width=\"1.5\"/> <g fill=\"#fff\" stroke=\"#475569\" stroke-width=\"1.6\"> <ellipse cx=\"38\" cy=\"44\" rx=\"16\" ry=\"6\"/><ellipse cx=\"76\" cy=\"44\" rx=\"16\" ry=\"6\"/><ellipse cx=\"124\" cy=\"44\" rx=\"16\" ry=\"6\"/><ellipse cx=\"162\" cy=\"44\" rx=\"16\" ry=\"6\"/></g> <g stroke=\"#94a3b8\" stroke-width=\"1.4\" fill=\"none\"> <path d=\"M38 34 v-8 M33 30 l5 -6 l5 6\"/><path d=\"M76 34 v-8 M71 30 l5 -6 l5 6\"/><path d=\"M124 34 v-8 M119 30 l5 -6 l5 6\"/><path d=\"M162 34 v-8 M157 30 l5 -6 l5 6\"/></g> <rect x=\"24\" y=\"118\" width=\"152\" height=\"8\" fill=\"#475569\"/> <path d=\"M60 126 v8 h-12 M140 126 v8 h12\" stroke=\"#1d6fb8\" stroke-width=\"3\" fill=\"none\"/>", "wc": "<rect x=\"26\" y=\"78\" width=\"148\" height=\"26\" rx=\"13\" fill=\"#dbe7f3\" stroke=\"#475569\" stroke-width=\"2\"/> <rect x=\"26\" y=\"46\" width=\"148\" height=\"26\" rx=\"13\" fill=\"#e9eef3\" stroke=\"#475569\" stroke-width=\"2\"/> <rect x=\"62\" y=\"18\" width=\"56\" height=\"28\" rx=\"4\" fill=\"#cbd5e1\" stroke=\"#475569\" stroke-width=\"2\"/> <path d=\"M118 30 h20 v16\" stroke=\"#475569\" stroke-width=\"2\" fill=\"none\"/> <rect x=\"150\" y=\"14\" width=\"30\" height=\"30\" rx=\"2\" fill=\"#fff\" stroke=\"#475569\" stroke-width=\"1.6\"/> <rect x=\"155\" y=\"19\" width=\"20\" height=\"9\" fill=\"#2a9d8f\"/><circle cx=\"160\" cy=\"36\" r=\"2\" fill=\"#475569\"/><circle cx=\"170\" cy=\"36\" r=\"2\" fill=\"#475569\"/> <rect x=\"34\" y=\"104\" width=\"10\" height=\"16\" fill=\"#475569\"/><rect x=\"156\" y=\"104\" width=\"10\" height=\"16\" fill=\"#475569\"/><rect x=\"26\" y=\"120\" width=\"148\" height=\"6\" fill=\"#475569\"/> <path d=\"M26 59 h-14 M26 91 h-14\" stroke=\"#1d6fb8\" stroke-width=\"4\"/><path d=\"M174 91 h14\" stroke=\"#1d6fb8\" stroke-width=\"4\"/><path d=\"M174 59 h14\" stroke=\"#1d6fb8\" stroke-width=\"4\"/> "};

const DESIGN_CONDITIONS = {
  pressure: 101.325, pressureLabel: '1atm',
  outdoor: [
    { id: 'SUMMER', name: 'SUMMER', db: 35, rh: 70, ah: 0.025161 },
    { id: 'WINTER', name: 'WINTER', db: 9, rh: 78, ah: 0.00555 },
  ],
  rooms: [
    // room conditions are generic (usable for clean room or general room) — room type comes from 청정도 (cleanClass)
    { id: 'CR1', name: 'ROOM CONDITION 1', dewName: 'DEW POINT (RC1)', db: 20, rh: 50, ah: 0.00726, dewDB: 10.0, dewRH: 95 },
    // 21℃/50% (회사 엑셀 CLEAN ROOM 조건) 추가 — 온도순으로 번호 재배열, id는 기존 저장 파일 호환을 위해 그대로 유지
    { id: 'RC21', name: 'ROOM CONDITION 2', dewName: 'DEW POINT (RC2)', db: 21, rh: 50, ah: 0.00773, dewDB: 11.0, dewRH: 95 },
    { id: 'CR2', name: 'ROOM CONDITION 3', dewName: 'DEW POINT (RC3)', db: 22, rh: 50, ah: 0.008226, dewDB: 11.86, dewRH: 95 },
    { id: 'RC23', name: 'ROOM CONDITION 4', dewName: 'DEW POINT (RC4)', db: 23, rh: 50, ah: 0.00878, dewDB: 12.8, dewRH: 95 },
    { id: 'GR', name: 'ROOM CONDITION 5', dewName: 'DEW POINT (RC5)', db: 24, rh: 50, ah: 0.0093, dewDB: 13.7, dewRH: 95 },
  ],

const num = v => (v !== '' && v != null && !isNaN(+v)) ? +v : null;
function tempAtRH(w, rh, P) {

}
function resolveRoom(c, P) {
  const ah = num(c.ah) ?? absHum(c.db, c.rh, P);

    id: c.id, custom: !!c.custom, name: c.name, dewName: c.dewName || ('DEW POINT (' + c.name + ')'),

function allRoomConds(I) { return DESIGN_CONDITIONS.rooms.concat((I.customConds || []).map(c => ({ ...c, custom: true }))); }

function ahuCalc({ I, L, RM, DP, S, W, saFinal, oa }, n) {
  const A = { n };
  A.rsh = L.total / n; A.rlh = I.rlh / n;
  A.oa = XL.roundup(oa / n, -3);
  A.saReq = (A.rsh + A.rlh) / 0.29 / (RM.db - DP.db);
  A.sa = XL.roundup(saFinal / n, -3);
  A.ra = A.sa - A.oa;
  // cooling
  A.ee = (A.ra * RM.h + A.oa * S.h) / A.sa;
  A.le = DP.h;
  A.mid = (A.ee + A.le) / 2;
  A.preRaw = XL.roundup(A.sa * 1.2 * (A.ee - A.mid), -2);
  A.pre = XL.roundup(A.preRaw * I.coolSF, -2);
  A.reRaw = XL.roundup(A.sa * 1.2 * (A.mid - A.le), -2);
  A.re = XL.roundup(A.reRaw * I.coolSF, -2);
  A.cool = A.pre + A.re;

  A.coolKw = A.cool / 860; A.coilIdx = A.sa > 0 ? A.coolKw / A.sa * 1000 : 0; A.twoCoil = A.coilIdx > 19;

  A.preRT = A.pre / 3024; A.reRT = A.re / 3024; A.preConv = A.pre / I.coolKcal; A.reConv = A.re / I.coolKcal;
  // heating — winter (동절기 난방)
  A.heatLoad = L.heat / n;
  A.et = (A.ra * RM.db + A.oa * W.db) / A.sa;
  A.lt = RM.db + A.heatLoad / 0.29 / A.sa;
  A.heatRaw = XL.roundup(A.sa * 0.29 * (A.lt - A.et), 0);
  A.heatCap = XL.roundup(A.heatRaw * I.heatSF, -2);

  A.tsup = RM.db - (L.total - L.proc) / n / (0.29 * A.sa);

  A.reheat = XL.roundup(A.reheatRaw * I.heatSF, -2);

  //                          수냉식(CW, 히트펌프 미사용) = MAX(동절기 HEATING, 하절기 RE-HEATING)
  A.heatHP = I.coolType === 'DX';

  A.heatKw = A.heatSel / 860; A.heatWKw = A.heatCap / 860; A.heatSKw = A.reheat / 860;

// ===== reference tables (company standard; Excel 2-1A / 2-2 reference data) =====
const CLASS_TBL = {
  '10':     {label:'Class 10',      ach:200, achRange:'200~600', pa:2.5},
  '100':    {label:'Class 100',     ach:200, achRange:'200~600', pa:2.0},
  '1000':   {label:'Class 1,000',   ach:50,  achRange:'50~70',   pa:1.5},
  '5000':   {label:'Class 5,000',   ach:35,  achRange:'35',      pa:1.5},
  '10000':  {label:'Class 10,000',  ach:30,  achRange:'30~40',   pa:1.5},

// ===== room model: every item per room; blank auto-items take the company standard =====
function defaultRoom(i = 1) {

    area: '', ch: 3, cleanClass: '100000', roomType: 'CR', condId: 'CR2', roomTtol: 2, roomRHtol: 10, illum: 500,
    personDensity: 0.05, persons: '', eaGen: '', eaProc: 0, eaSaRatio: 0,
    bldgUnit: 50, heatUnit: 50, lightUnit: '', lightFactor: 1.5, personSH: '', roomSF: 0,
    procMode: 'density', targetDensity: '', densityKw: '', densityRate: 30, pcwLpm: 0, pcwDT: 5, exCmh: 0, exDT: 0,
    ach: '', paFactor: '', faPerPerson: '', tempACH: '', caRatio: 50,
    bfuCMM: 28, bfuSF: 1.1, bfuW: 300, bfuFactor: 0.3, bfuQty: '', fanLoad: '', hfbCMM: 28, hfbSF: 1.1, hfbQty: '' };

    bldgUnit: o.bldgUnit ?? 50, heatUnit: o.heatUnit ?? 50, lightUnit: pick('lightUnit', 1), lightFactor: o.lightFactor ?? 1.5,
    personSH: pick('personSH', 1), roomSF: o.roomSF ?? 0, procMode: o.procMode || 'density', targetDensity: pick('targetDensity', 1),
    densityKw: o.densityKw ?? '', densityRate: o.densityRate ?? 30, ach: pick('ach', 1), paFactor: pick('paFactor', 1),
    faPerPerson: pick('faPerPerson', 1), tempACH: pick('tempACH', 1), caRatio: o.caRatio ?? 50,

// ---- one room: loads, make-up air, supply air (company Excel method), BFU fan heat & S.A-based exhaust solved iteratively

    const gov = govKey === 'load' ? `부하 (ΔT ${(Math.round(dT * 100) / 100).toFixed(2)}℃)` : govKey === 'oa' ? '외기량 (O.A)' : govKey === 'ca' ? `C.A × ${U.caRatio}%` : '온도편차 환기횟수';
    if (dT <= 0) w.push(`${tag}: 실내온도가 코일 출구(노점)온도보다 낮거나 같습니다.`);
    const air2 = { ca, dT, saLoad, saTemp, saCa, saFinal, gov, govKey, achActual: vol ? saFinal / vol : 0, caACH: vol ? ca / vol : 0 };
    const bfuAuto = +rm.bfuCMM > 0 ? Math.max(0, XL.roundup((ca - saFinal) / +rm.bfuCMM / 60 * (+rm.bfuSF || 1), 0)) : 0;

    return { L, air2, procRows, procDensity, procTot: { H: pH, K: pK, M: pM, N: pN, kw: pKw, mode: rm.procMode === 'power' ? 'power' : 'density', usePCW, useEx }, w, bfuAuto, hfb };
  };

  run();

  return { ix, id: rm.id, name: tag, building: rm.building, rm, cond, RM: RMr, area, ch, vol, persons, U, paFactor, faPP,
    L: sol.L, air2: sol.air2, proc: sol.procRows, procDensity: sol.procDensity, procTot: sol.procTot,

    warn: sol.w.concat(W_) };
}

function calculate(I0) {

    dT: RM.db - DP.db, gov: RR.length === 1 ? RR[0].air2.gov : '룸별 MAX 합계', govKey: RR.length === 1 ? RR[0].air2.govKey : 'rooms', achActual: vol ? saFinal / vol : 0 };

let UI = { lang:'ko', skin:'black' };

const LI = () => UI.lang==='en'?0:UI.lang==='vi'?1:-1;
function trText(src){
  const li=LI(); if(li<0 || !src || !/[가-힣]/.test(src)) return src;
  const t=src.trim(); if(PHRASES[t]) return src.replace(t, PHRASES[t][li]);
  return src.replace(/[가-힣]+(?:[ ·][가-힣]+)*/g, run=>{
    if(I18N[run]) return I18N[run][li];
    return run.split(/([ ·])/).map(w=> I18N[w]? I18N[w][li] : w).join('');
  }).replace(/  +/g,' ');
}
const TR_ATTRS=['placeholder','title','aria-label'];
function trDOM(root){
  if(!root) return;
  const li=LI();
  const tw=document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {acceptNode:n=>{ const p=n.parentNode&&n.parentNode.nodeName; return (p==='SCRIPT'||p==='STYLE')?NodeFilter.FILTER_REJECT:NodeFilter.FILTER_ACCEPT; }});
  let n; while((n=tw.nextNode())){ if(n.__ko===undefined){ if(!/[가-힣]/.test(n.nodeValue)) continue; n.__ko=n.nodeValue; } n.nodeValue = li<0 ? n.__ko : trText(n.__ko); }
  root.querySelectorAll('[placeholder],[title],[aria-label]').forEach(el=>TR_ATTRS.forEach(a=>{ if(!el.hasAttribute(a)) return; const k='ko'+a.replace(/-/g,''); if(el.dataset[k]===undefined){ const v=el.getAttribute(a); if(!/[가-힣]/.test(v)) return; el.dataset[k]=v; } el.setAttribute(a, li<0? el.dataset[k] : trText(el.dataset[k])); }));
}
function applyUI(){
  document.documentElement.setAttribute('data-skin', UI.skin);
  document.documentElement.lang = UI.lang==='en'?'en':UI.lang==='vi'?'vi':'ko';
  document.querySelectorAll('[data-lang]').forEach(b=>b.setAttribute('aria-pressed', b.dataset.lang===UI.lang));
  document.querySelectorAll('[data-skin]').forEach(b=>{ if(b.tagName==='BUTTON') b.setAttribute('aria-pressed', b.dataset.skin===UI.skin); });
  document.title = trText('클린룸 HVAC 부하계산서');
  try{ localStorage.setItem('crLoadCalc.ui', JSON.stringify(UI)); }catch(e){}
}
document.addEventListener('click', e=>{
  const b=e.target.closest && e.target.closest('[data-lang],button[data-skin]'); if(!b) return;
  if(b.dataset.lang){ UI.lang=b.dataset.lang; applyUI(); $('side').innerHTML=''; rebuild(); trDOM(document.querySelector('header')); trDOM($('report')); if($('report').style.display==='block') buildReport(); trDOM(document.getElementById('pasteDlg')); }
  else { UI.skin=b.dataset.skin; applyUI(); }
});

function roomCell(r,i,[k,h,u,t,w,o={}]){

  if(t==='num') return `<td><input ${a} type="number" step="any" value="${v===''||v==null?'':v}"${o.req?' class="req" placeholder="입력"':''}></td>`;
  if(t==='auto') return `<td><input ${a} type="number" step="any" class="ra" id="ra_${i}_${k}" value="${v===''||v==null?'':v}"></td>`;
  if(t==='sel') return `<td><select ${a}>${o.opts().map(([x,y])=>`<option value="${x}"${String(x)===String(v)?' selected':''}>${y}</option>`).join('')}</select></td>`;

function onInput(e){
  const t = e.target;
  if(t.dataset.oac!=null){
    const f=t.dataset.oac; S.oac[f] = f==='tag' ? t.value : (t.value===''?'':parseFloat(t.value));
    if(f==='qty' && !(S.oac.qty>=1) && e.type==='change'){ S.oac.qty=1; t.value=1; }
    update(); return;
  }
  if(t.dataset.oacx!=null){
    const x=S.oac.ahus[+t.dataset.oacx], f=t.dataset.f; x[f] = f==='tag'?t.value:(parseFloat(t.value)||0); update(); return;
  }
  if(t.id==='oacFile'){ if(e.type==='change') loadOacFiles(t.files); return; }
  if(t.dataset.rm!=null){
    const r=S.rooms[+t.dataset.rm], f=t.dataset.f; if(!r) return;
    let v = t.type==='number' ? (t.value===''?'':parseFloat(t.value)) : t.value;
    if(t.tagName==='SELECT' && ['roomTtol','illum'].includes(f)) v=parseFloat(v);
    r[f]=v;
    if(e.type==='change'){
      if(f==='cleanClass' && v==='GR' && r.roomType!=='GR'){ r.roomType='GR'; const s=document.querySelector(`[data-rm="${t.dataset.rm}"][data-f="roomType"]`); if(s) s.value='GR'; }
      if(f==='name'){ rebuild(); return; }
    }
  } else if(t.dataset.k){
    if(t.readOnly) return;
    const k=t.dataset.k;
    if(t.type==='checkbox'){ S[k]=t.checked; if(e.type==='change') rebuild(); return; }
    let v = t.type==='number' ? (t.value===''? ((t.dataset.ah||t.dataset.req)?'':0) : parseFloat(t.value)) : t.value;
    S[k]=v;
    if(e.type==='change' && k==='coolType'){ S.coolKcal = v==='DX'?2150:3024; $('i_coolKcal').value=S.coolKcal; toast(`${v==='DX'?'공냉식 DX 1HP = 2,150':'수냉식 1RT = 3,024'} kcal/h 적용 (환산값은 직접 수정 가능)`); }
  } else if(t.dataset.cc!=null){
    const r=S.customConds[+t.dataset.cc], f=t.dataset.f;
    if(f==='name') r.name=t.value; else if(['ah','dewDB'].includes(f)) r[f]= t.value===''?'':parseFloat(t.value); else r[f]=parseFloat(t.value)||0;
    if(e.type==='change'){ rebuild(); return; }
  } else if(t.dataset.eq!=null){
    const r=S.equip[+t.dataset.eq], f=t.dataset.f; r[f] = t.type==='number' ? (parseFloat(t.value)||0) : t.value;
  } else if(t.dataset.sp!=null){
    const r=S.spItems[+t.dataset.sp], f=t.dataset.f;
    if(f==='name') r.name=t.value; else if(f==='qty') r.qty = t.value===''?null:parseFloat(t.value); else r.unit=parseFloat(t.value)||0;
  } else return;
  update();
}

  if(t.id==='addCond'){ const n=(S.customConds||[]).length+1; let id='C'+Date.now().toString(36); S.customConds=(S.customConds||[]).concat([{id,name:'ROOM CONDITION '+(DESIGN_CONDITIONS.rooms.length+n),db:22,rh:50,ah:'',dewDB:'',dewRH:95}]); rebuild(); toast('설계조건을 추가했습니다. 룸 표의 "설계조건"에서 선택할 수 있습니다.'); }
  if(t.dataset.delcc!=null){ const c=S.customConds[+t.dataset.delcc]; S.customConds.splice(+t.dataset.delcc,1); S.rooms.forEach(r=>{ if(r.condId===c.id) r.condId='CR2'; }); rebuild(); }

// ---------- psychrometric chart ----------
function psyPoints(){
  const a=R.air, A=R.ahu, P=DESIGN_CONDITIONS.pressure;
  const tm=(A.ra*a.RM.db + A.oa*a.Sin.db)/A.sa, wm=(A.ra*a.RM.ah + A.oa*a.Sin.ah)/A.sa;
  const pts=[
    ...(a.oacMode?[{id:'S0',name:'외기 (하절기 · OAC 입구)',en:'O.A SUMMER',t:a.S.db,w:a.S.ah,c:'#b3261e'}]:[]),
    {id:'S1',name:a.oacMode?'OAC 토출 (AHU 도입 외기)':'외기 (하절기)',en:a.oacMode?'OAC SUPPLY':'O.A SUMMER',t:a.Sin.db,w:a.Sin.ah,c:'#b3261e'},
    {id:'S2',name:'혼합 (하절기)',en:'MIXED AIR (E.E)',t:tm,w:wm,c:'#b3261e'},
    {id:'S3',name:'코일 출구 (노점)',en:'COIL LEAVING',t:a.DP.db,w:a.DP.ah,c:'#b3261e'},
    {id:'S4',name:A.heatOff?'급기 (재열 없음)':'급기 (재열 후)',en:A.heatOff?'SUPPLY AIR (NO RE-HEAT)':'SUPPLY AIR (RE-HEAT)',t:A.heatOff?a.DP.db:A.tsup,w:a.DP.ah,c:'#b3261e'},
    {id:'R', name:'실내',en:'ROOM',t:a.RM.db,w:a.RM.ah,c:'#16202b'},
    {id:'W1',name:'외기 (동절기)',en:'O.A WINTER',t:a.W.db,w:a.W.ah,c:'#1d5fa8'},
    {id:'W2',name:'혼합 (동절기)',en:'MIXED AIR (E.T)',t:A.et,w:A.eh,c:'#1d5fa8'},
    {id:'W3',name:A.heatOff?'가열 없음':'가열 후',en:A.heatOff?'NO HEATING':'AFTER HEATING',t:A.heatOff?A.et:A.lt,w:A.eh,c:'#1d5fa8'},
    {id:'W4',name:A.humOff?'급기 (가습 없음)':'가습 후 (급기)',en:A.humOff?'SUPPLY (NO HUMID.)':'AFTER HUMIDIFICATION',t:A.heatOff?A.et:A.lt,w:A.humOff?A.eh:a.RM.ah,c:'#1d5fa8'},
  ];
  pts.forEach(p=>{ p.rh=Math.min(100,rhFrom(p.t,p.w,P)); p.h=enth(p.t,p.w); });
  if(a.oacMode){ const s1=pts.find(p=>p.id==='S1'); s1.h=a.Sin.h; s1.rh=a.Sin.rh; }
  return pts;
}
let PSY_N=0;
// 습공기 선도 — 하절기 / 동절기를 각각 별도 선도로, 각 계절의 상태점 범위로 자동 확대
function psyChart(season, forReport){
  const uid='p'+(++PSY_N), P=DESIGN_CONDITIONS.pressure, A=R.ahu;
  const by=Object.fromEntries(psyPoints().map(p=>[p.id,p])), sum=season==='S';
  const pts=(sum?['S0','S1','S2','S3','S4','R']:['W1','W2','W3','W4','R']).map(i=>by[i]).filter(Boolean);
  const C=sum?'#c0262d':'#1d5fa8', K='#16202b', G='#6b7785';
  const W=760, H=forReport?318:430, ml=46, mr=66, mt=40, mb=36, pw=W-ml-mr, ph=H-mt-mb;
  let ta=Math.floor(Math.min(...pts.map(p=>p.t))-1.5), tb=Math.ceil(Math.max(...pts.map(p=>p.t))+1.5); if(tb-ta<12) tb=ta+12;
  let wa=Math.max(0,Math.floor((Math.min(...pts.map(p=>p.w))-0.0016)*2000)/2000), wb=Math.ceil((Math.max(...pts.map(p=>p.w))+0.001)*2000)/2000;
  if(wb-wa<0.004){ const c=(wa+wb)/2; wa=Math.max(0,Math.floor((c-0.002)*2000)/2000); wb=wa+0.004; }
  const X=t=>ml+(t-ta)/(tb-ta)*pw, Y=w=>mt+ph-(w-wa)/(wb-wa)*ph, wsat=t=>absHum(t,100,P);
  const path=f=>{ let d='',on=false; for(let i=0;i<=(tb-ta)*5;i++){ const t=ta+i/5, w=f(t); if(w==null){on=false;continue;} d+=(on?'L':'M')+X(t).toFixed(1)+','+Y(w).toFixed(1); on=true; } return d; };
  let g='';
  // grid
  for(let t=ta;t<=tb;t++){ const maj=t%5===0; g+=`<line x1="${X(t)}" y1="${mt}" x2="${X(t)}" y2="${mt+ph}" stroke="${maj?'#d9e0e7':'#eef2f5'}"/>`; if(maj) g+=`<text x="${X(t)}" y="${mt+ph+14}" text-anchor="middle" class="ax">${t}</text>`; }
  const ws=(wb-wa)<=0.008?0.001:(wb-wa)<=0.024?0.002:0.005;
  for(let k=Math.ceil(wa/ws-1e-6);k*ws<=wb+1e-9;k++){ const w=k*ws; g+=`<line x1="${ml}" y1="${Y(w)}" x2="${ml+pw}" y2="${Y(w)}" stroke="#d9e0e7"/><text x="${ml+pw+5}" y="${Y(w)+3}" class="ax">${w.toFixed(3)}</text>`; }
  // region above saturation
  let curves=`<path d="${path(wsat)}L${X(tb)},${mt-60}L${X(ta)},${mt-60}Z" fill="#eef1f4"/>`;
  // enthalpy lines
  const h0=enth(ta,wa), h1=enth(tb,Math.min(wb,wsat(tb))), hs=(h1-h0)>24?5:(h1-h0)>10?2:1;
  for(let h=Math.ceil(h0/hs)*hs;h<=h1;h+=hs){ const f=t=>{ const w=(h*4.186-1.005*t)/(2500+1.84*t); return (w<=wsat(t))?w:null; };
    curves+=`<path d="${path(f)}" fill="none" stroke="#b7c8da" stroke-dasharray="3 3"/>`;
    // label: where the line leaves the saturation curve; if it enters from the top edge, label at its lower end instead (keeps clear of RH labels)
    let t0=null; for(let i=0;i<=(tb-ta)*10;i++){ const t=ta+i/10, w=f(t); if(w!=null&&w<=wb&&w>=wa){ t0=t; break; } }
    if(t0==null) continue;
    if(f(t0)<wb-(wb-wa)*0.03) g+=`<text x="${X(t0)+3}" y="${Y(f(t0))-3}" class="hl">h${h}</text>`;
    else { let t1=null; for(let i=(tb-ta)*10;i>=0;i--){ const t=ta+i/10, w=f(t); if(w!=null&&w>=wa&&w<=wb){ t1=t; break; } }
      if(t1!=null&&X(t1)<ml+pw-24) g+=`<text x="${X(t1)-3}" y="${Math.min(Y(f(t1))-3,mt+ph-3)}" text-anchor="end" class="hl">h${h}</text>`; } }
  // RH curves
  for(let rh=10;rh<100;rh+=10){ if(absHum(tb,rh,P)<wa) continue; curves+=`<path d="${path(t=>absHum(t,rh,P))}" fill="none" stroke="#c3ccd5" stroke-width="0.9"/>`;
    let t=tb; while(t>ta&&absHum(t,rh,P)>wb) t-=0.1; const w=absHum(t,rh,P); if(w>=wa) g+=`<text x="${X(t)-3}" y="${t<tb?mt+10:Y(w)-3}" text-anchor="end" class="rl">${rh}%</text>`; }
  curves+=`<path d="${path(wsat)}" fill="none" stroke="${K}" stroke-width="1.8"/>`;
  // processes
  const mixId=sum?'S2':'W2', oaId=sum?'S1':'W1', steps=[];
  if(sum){
    if(by.S0) steps.push({a:by.S0,b:by.S1,lb:tl('OAC 냉각·제습','OAC cooling · dehum.','OAC làm lạnh · tách ẩm')});
    steps.push({a:by.S2,b:by.S3,lb:A.twoCoil?tl('냉각·제습 (Pre + Re 코일)','Cooling · dehum. (Pre + Re coil)','Làm lạnh · tách ẩm (Pre + Re)'):tl('냉각·제습','Cooling · dehum.','Làm lạnh · tách ẩm')});
    steps.push({a:by.S3,b:by.S4,lb:tl('재열','Re-heat','Gia nhiệt lại'),off:Math.abs(Y(by.S2.w)-Y(by.S3.w))<0.35*Math.abs(X(by.S2.t)-X(by.S3.t))?8:0});   // 냉각선과 겹치면 아래로 평행 이동
    steps.push({a:by.S4,b:by.R,lb:tl('급기 → 실내 (실내 부하)','Supply → room (room load)','Gió cấp → phòng'),room:1});
  } else {
    steps.push({a:by.W2,b:by.W3,lb:tl('가열','Heating','Gia nhiệt')});
    steps.push({a:by.W3,b:by.W4,lb:tl('가습','Humidification','Tạo ẩm')});
    steps.push({a:by.W4,b:by.R,lb:tl('급기 → 실내','Supply → room','Gió cấp → phòng'),room:1});
  }
  const live=steps.filter(s=>Math.hypot(X(s.b.t)-X(s.a.t),Y(s.b.w)-Y(s.a.w))>3);
  const obs=[], seg=[]; const addSeg=(a,b)=>{ const x0=X(a.t),y0=Y(a.w),x1=X(b.t),y1=Y(b.w),L=Math.hypot(x1-x0,y1-y0),n=Math.max(1,Math.ceil(L/4)); for(let i=0;i<=n;i++){ const x=x0+(x1-x0)*i/n,y=y0+(y1-y0)*i/n; obs.push([x-2,y-2,x+2,y+2,1]); } };
  let lines='';

  // 외기부하 참고 보조선 (하절기 S1 → S3) — 계산에는 사용하지 않음

  if(sum&&by.S1&&by.S3){ const a=by.S1,b=by.S3, x0=X(a.t),y0=Y(a.w),x1=X(b.t),y1=Y(b.w);
    lines=`<line x1="${x0}" y1="${y0}" x2="${x1}" y2="${y1}" stroke="#8d99a6" stroke-width="1.4" stroke-dasharray="9 3 2 3"/>`+lines; addSeg(a,b);
    const mx=x0+(x1-x0)*0.42, my=y0+(y1-y0)*0.42, ang=Math.atan2(y1-y0,x1-x0)*180/Math.PI, rot=ang>90||ang<-90?ang+180:ang;
    oaRef=`<text transform="translate(${mx.toFixed(1)},${(my-5).toFixed(1)}) rotate(${rot.toFixed(1)})" text-anchor="middle" class="tt" fill="#6b7785" paint-order="stroke" stroke="#fff" stroke-width="3">${tl('외기부하 (참고)','O.A load (ref.)','Tải gió tươi (tham khảo)')}</text>`; }
  const circ='①②③④⑤', nums=[];
  live.forEach((s,i)=>{ const o=s.off||0, x0=X(s.a.t),y0=Y(s.a.w)+o,x1=X(s.b.t),y1=Y(s.b.w)+o,L=Math.hypot(x1-x0,y1-y0),ux=(x1-x0)/L,uy=(y1-y0)/L;
    const sa=Math.min(6,L*0.2), sb=Math.min(8,L*0.3), c=s.room?G:C;

    lines+=`<line x1="${(x0+ux*sa).toFixed(1)}" y1="${(y0+uy*sa).toFixed(1)}" x2="${(x1-ux*sb).toFixed(1)}" y2="${(y1-uy*sb).toFixed(1)}" stroke="${c}" stroke-width="${s.room?1.6:3}" ${s.room?'stroke-dasharray="2 4" stroke-linecap="round"':''} marker-end="url(#${uid}${s.room?'g':'c'})"/>`;
    addSeg(s.a,s.b);
    let mx=(x0+x1)/2, my=(y0+y1)/2; const nx=uy, ny=-ux, sgn=o?-1:(ny<=0?1:-1); if(L<40||o){ mx+=nx*sgn*15; my+=ny*sgn*15; }
    nums.push({x:mx,y:my,c,n:circ[i]}); obs.push([mx-9,my-9,mx+9,my+9,6]); s.no=circ[i]; });
  // markers
  const mark=p=>{ const x=X(p.t),y=Y(p.w);
    if(p.id==='R') return `<path d="M${x},${y-7} L${x+7},${y} L${x},${y+7} L${x-7},${y} Z" fill="#fff" stroke="${K}" stroke-width="2"/>`;
    if(!sum) return `<rect x="${x-4.5}" y="${y-4.5}" width="9" height="9" fill="${C}" stroke="#fff" stroke-width="1.5"/>`;
    return `<circle cx="${x}" cy="${y}" r="5" fill="${p.id==='S0'?'#fff':C}" stroke="${p.id==='S0'?C:'#fff'}" stroke-width="${p.id==='S0'?2:1.5}"/>`; };
  pts.forEach(p=>{ const x=X(p.t),y=Y(p.w); obs.push([x-8,y-8,x+8,y+8,8]); });
  // badges (자동 배치, 멀리 놓이면 지시선)
  const hit=b=>obs.reduce((s,o)=>s+((b[0]<o[2]&&b[2]>o[0]&&b[1]<o[3]&&b[3]>o[1])?o[4]:0),0);
  const inside=b=>b[0]>ml+1&&b[2]<ml+pw-1&&b[1]>mt+1&&b[3]<mt+ph-1;
  let leads='', badges='';
  const order=[...pts].sort((a,b)=>(a.id==='R'?-1:0)-(b.id==='R'?-1:0));
  order.forEach(p=>{ const x=X(p.t),y=Y(p.w), bw=p.id.length*7.4+12, bh=17, col=p.id==='R'?K:C; let best=null,bs=1e9;
    outer: for(const r of [13,20,30,42,56,72,90,110]){ for(let k=0;k<16;k++){ const ang=Math.PI/2+(k%2?1:-1)*Math.ceil(k/2)*Math.PI/8, rr=r+Math.abs(Math.cos(ang))*bw/2+Math.abs(Math.sin(ang))*bh/2;
        const cx=x+Math.cos(ang)*rr, cy=y-Math.sin(ang)*rr, b=[cx-bw/2,cy-bh/2,cx+bw/2,cy+bh/2]; if(!inside(b)) continue;
        const h=hit(b); if(h===0){ best={cx,cy,b,r}; break outer; } if(h+r/10<bs){ bs=h+r/10; best={cx,cy,b,r}; } } }

    if(best.r>13){ const ex=Math.max(best.b[0],Math.min(x,best.b[2])), ey=Math.max(best.b[1],Math.min(y,best.b[3])); leads+=`<line x1="${x}" y1="${y}" x2="${ex.toFixed(1)}" y2="${ey.toFixed(1)}" stroke="${col}" stroke-width="1"/>`; }
    badges+=`<rect x="${best.b[0].toFixed(1)}" y="${best.b[1].toFixed(1)}" width="${bw.toFixed(1)}" height="${bh}" rx="8.5" fill="${p.id==='R'?'#fff':col}" stroke="${col}" stroke-width="1.5"/><text x="${best.cx.toFixed(1)}" y="${(best.cy+4).toFixed(1)}" text-anchor="middle" class="bd" fill="${p.id==='R'?K:'#fff'}">${p.id}</text>`; });
  const numsSvg=nums.map(n=>`<circle cx="${n.x.toFixed(1)}" cy="${n.y.toFixed(1)}" r="8.5" fill="#fff" stroke="${n.c}" stroke-width="1.6"/><text x="${n.x.toFixed(1)}" y="${(n.y+4).toFixed(1)}" text-anchor="middle" class="nm" fill="${n.c}">${n.n}</text>`).join('');

  const svg=`<svg viewBox="0 0 ${W} ${H}" class="psy" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="${esc(title)}">

    <rect width="${W}" height="${H}" fill="#fff"/>
    <g clip-path="url(#${uid}clip)">${curves}</g>${g}
    <rect x="${ml}" y="${mt}" width="${pw}" height="${ph}" fill="none" stroke="#9aa6b2"/>
    <g clip-path="url(#${uid}clip)">${lines}</g>${oaRef}${leads}${numsSvg}${pts.map(mark).join('')}${badges}
    <text x="${ml}" y="18" class="ti" fill="${C}">${title}</text>
    <g transform="translate(${ml},30)" class="tt"><line x1="0" y1="-3" x2="22" y2="-3" stroke="${C}" stroke-width="2" stroke-dasharray="7 4"/><text x="27" y="0">${tl('혼합','mixing','hòa trộn')}</text>
      <line x1="72" y1="-3" x2="96" y2="-3" stroke="${C}" stroke-width="3"/><path d="M96,-8 L105,-3 L96,2 z" fill="${C}"/><text x="110" y="0">${tl('처리 과정','process','quá trình')}</text>

  const cap=`<div class="psycap"><span style="color:${C};font-weight:700">${by[oaId].id} + R → ${mixId}</span> ${tl('혼합 (외기 + 환기)','mixing (O.A + R.A)','hòa trộn (gió tươi + hồi)')}`

    + (sum&&by.S1&&by.S3?` · <span style="color:#6b7785">${by.S1.id} ⇢ S3 ${tl('외기부하 (참고)','O.A load (ref.)','tải gió tươi (TK)')} = O.A ${fmt(A.oa)} × 1.2 × (${fmt(by.S1.h,2)} − ${fmt(by.S3.h,2)}) = <b>${fmt(A.oa*1.2*(by.S1.h-by.S3.h))} kcal/h</b></span>`:'')

function capTable(B, A, T){

  return heatNote ? capTableHTML() + heatNote : capTableHTML();
  function capTableHTML(){ return `<table class="rt"><tr><th>ITEM</th><th>전체 (실 전체 기준)</th><th>대당 (1대)</th><th>합계 (대당 × ${T.n})</th><th>UNIT</th></tr>

// ---------- report notes: 한 줄로 이어진 부연설명을 항목별 줄바꿈 ----------
// 괄호 밖의 " · " 구분자, 3칸 이상 공백(수식 사이), 문장 끝(다. / 영문 마침표)에서 줄을 바꿈. 표 안 글자는 건드리지 않음.
function breakReportLines(){
  document.querySelectorAll('#pages .eq, #pages .note').forEach(el=>{
    if(el.closest('table') || el.dataset.lb) return; el.dataset.lb='1';
    // 습공기 선도 페이지(차트 2개)는 공간이 빠듯해 상단 부제는 한 줄 유지
    if(el.closest('.page') && el.closest('.page').querySelector('.psy2') && el.nextElementSibling && el.nextElementSibling.querySelector && el.nextElementSibling.querySelector('svg')) return;
    const isEq = el.classList.contains('eq');
    let depth=0;
    const walk=document.createTreeWalker(el, NodeFilter.SHOW_TEXT); const nodes=[]; while(walk.nextNode()) nodes.push(walk.currentNode);
    nodes.forEach(tn=>{
      const t=tn.nodeValue, parts=[]; let cur='';
      for(let i=0;i<t.length;i++){
        const ch=t[i];
        if(ch==='('||ch==='['){ depth++; cur+=ch; continue; }
        if(ch===')'||ch===']'){ depth=Math.max(0,depth-1); cur+=ch; continue; }
        if(depth===0){
          if(t.startsWith(' · ',i)){ parts.push(cur); cur=''; i+=2; continue; }
          if(isEq && t.startsWith('   ',i) && (cur.trim() || tn.previousSibling)){ let j=i; while(t[j]===' ') j++; if(t[j] && t[j]!=='\n'){ parts.push(cur); cur=''; i=j-1; continue; } }
          if(!isEq && ch==='.' && t[i+1]===' ' && /[다a-z0-9)]/.test(t[i-1]||'') && /[A-Z가-힣※*]/.test(t[i+2]||'')){ cur+='.'; parts.push(cur); cur=''; i+=1; continue; }
        }
        cur+=ch;
      }
      parts.push(cur);
      if(parts.length<2) return;
      const frag=document.createDocumentFragment();
      parts.forEach((pt,k)=>{ if(k) frag.appendChild(document.createElement('br')); frag.appendChild(document.createTextNode(k?pt.replace(/^\s+/,''):pt)); });
      tn.parentNode.replaceChild(frag, tn);
    });
  });
}

      <text x="40" y="110" font-family="Arial, sans-serif" font-weight="700" font-size="11" letter-spacing="1" fill="#1d4f86">SHINSUNG E&amp;G VIETNAM</text>
    </pattern></defs><rect width="100%" height="100%" fill="url(#wmPat)" opacity="0.07"/></svg>`;
}
function applyWatermark(){
  const on = !!S.watermark, b=$('btnWm');
  if(b){ b.setAttribute('aria-pressed', on); b.textContent = trText(on?'워터마크 해제':'워터마크 적용'); }
  document.querySelectorAll('#pages .page').forEach(pg=>{
    const old=pg.querySelector(':scope > .wm-layer'); if(old) old.remove();
    if(on){ const d=document.createElement('div'); d.className='wm-layer'; d.innerHTML=watermarkSVG(); pg.appendChild(d); }
  });
}
$('btnWm').onclick=()=>{ S.watermark=!S.watermark; applyWatermark(); toast(S.watermark?'보고서 워터마크를 적용했습니다.':'보고서 워터마크를 해제했습니다.'); };

// ---------- view switching / print ----------
function show(view){
  if(view==='report' && !R.ready){ toast('면적 등 필수 입력값을 먼저 넣어주세요: '+MISSING().join(', ')); view='calc'; }
  const rpt = view==='report';
  if(rpt) buildReport();
  if(view==='oac') updateOAC();
  $('calc').style.display = view==='calc'?'block':'none';
  $('oacView').style.display = view==='oac'?'block':'none';
  $('report').style.display = rpt?'block':'none';
  $('tabCalc').setAttribute('aria-pressed', view==='calc'); $('tabOac').setAttribute('aria-pressed', view==='oac'); $('tabRpt').setAttribute('aria-pressed', rpt);
  window.scrollTo(0,0);
}
function doPrint(){
  if(!R.ready){ show('report'); return; }

  setTimeout(()=>{ let ok=true; try{ window.print(); }catch(e){ ok=false; }
    if(!ok || window.self!==window.top) $('printNote').innerHTML = '<b>이 미리보기 화면에서는 인쇄가 막혀 있을 수 있습니다.</b> 함께 전달된 HTML 파일을 브라우저(Chrome/Edge)에서 직접 열어 "인쇄 / PDF 저장"을 누르세요. A4 세로, 여백 없음, 배경 그래픽 켜기.';
  }, 200);
}

$('btnReset').onclick=()=>{ let ok=true; try{ ok=window.confirm(trText('입력한 내용이 모두 지워집니다. 계속할까요?')); }catch(e){} if(!ok) return; S=clone(DEFAULTS); $('side').innerHTML=''; buildInputs(); update(); toast('모든 입력값을 초기 기본값으로 되돌렸습니다.'); };
function applyLoaded(o){
  if(o && o.app==='crLoadCalc' && o.data) o=o.data;
  if(!o || typeof o!=='object' || Array.isArray(o)) throw new Error('bad');
  const eqN=(Array.isArray(o.equip)?o.equip:[]).filter(e=>(+e.kw||0)>0).length;
  S=normState(o); $('side').innerHTML=''; buildInputs(); update();
  if(eqN) setTimeout(()=>toast(`이 파일의 공정 장비 목록 ${eqN}건은 더 이상 사용하지 않습니다. 해당 kW를 룸 입력의 POWER 칸에 넣어주세요.`),2700);
}
$('btnCopy').onclick=()=>{
  const d=new Date(), p2=x=>String(x).padStart(2,'0'), stamp=`${d.getFullYear()}${p2(d.getMonth()+1)}${p2(d.getDate())}_${p2(d.getHours())}${p2(d.getMinutes())}`;
  const name=`HVAC_LOAD_${([S.project,S.zone].filter(Boolean).join('_')||(S.rooms[0]&&S.rooms[0].name)||'INPUT').replace(/[\\/:*?"<>|\s]+/g,'_')}_${stamp}.json`;
  const txt=JSON.stringify({app:'crLoadCalc',version:1,savedAt:d.toISOString(),data:S},null,1);
  try{
    const url=URL.createObjectURL(new Blob([txt],{type:'application/json'}));
    const a=document.createElement('a'); a.href=url; a.download=name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),2000);
    toast(`입력값을 파일로 저장했습니다: ${name}`);
  }catch(e){ $('pasteTxt').value=txt; $('pasteDlg').showModal(); toast('파일 저장이 막혀 있습니다. 상자 안 내용을 복사해 보관하세요.'); }

$('btnPaste').onclick=()=>{ const f=$('loadFile'); f.value=''; f.click(); };
$('loadFile').addEventListener('change',e=>{
  const f=e.target.files&&e.target.files[0]; if(!f) return;
  const rd=new FileReader();
  rd.onload=()=>{ try{ applyLoaded(JSON.parse(rd.result)); toast(`입력값을 불러왔습니다: ${f.name}`); }catch(err){ toast('파일 형식이 올바르지 않습니다. "입력값 저장"으로 만든 .json 파일을 선택하세요.'); } };
  rd.readAsText(f,'utf-8');
});
$('pasteForm').addEventListener('submit',e=>{
  if(e.submitter && e.submitter.value==='ok'){ try{ applyLoaded(JSON.parse($('pasteTxt').value)); toast('입력값을 불러왔습니다.'); }catch(err){ e.preventDefault(); toast('JSON 형식이 올바르지 않습니다. "입력값 복사"로 만든 내용을 그대로 붙여넣으세요.'); } }
});
